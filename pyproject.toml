[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ollama-performance-studio"
version = "0.1.0"
description = "Professional LLM performance analysis studio for Ollama — evaluates local models with comprehensive metrics and reporting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ollama", "llm", "benchmark", "performance", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx==0.27.*",
    "pydantic==2.*",
    "pyyaml==6.*",
    "sqlalchemy==2.*",
    "typer==0.12.*",
    "click==8.1.*",
    "rich==13.*",
    "jinja2==3.*",
    "flask==3.*",
    "psutil==5.*",
    "sentence-transformers==3.*",
]

[project.optional-dependencies]
dev = [
    "hypothesis==6.*",
    "pytest==8.*",
    "pytest-asyncio==0.23.*",
]
gpu = [
    "pynvml==11.*",
]

[project.scripts]
ops = "ollama_benchmark.cli:app"

[project.urls]
Repository = "https://github.com/example/ollama-performance-studio"
Issues = "https://github.com/example/ollama-performance-studio/issues"

[tool.hatch.build.targets.wheel]
packages = ["ollama_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "integration: marks tests as integration tests (require live Ollama)",
]

[tool.hatch.envs.default]
dependencies = [
    "hypothesis==6.*",
    "pytest==8.*",
    "pytest-asyncio==0.23.*",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args}"
test-cov = "pytest --cov=ollama_benchmark {args}"
